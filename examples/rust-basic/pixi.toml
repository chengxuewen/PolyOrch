# The rust-basic example's own pixi workspace: the default environment
# carries the rust toolchain.  Installation happens ONLY through
# env-setup.cmake (cmake -P, build time / explicit target) -- the project
# configure step itself never touches the network.
[workspace]
channels = ["conda-forge"]
name = "rust-basic"
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]
version = "0.1.0"

[dependencies]
rust = "*"
