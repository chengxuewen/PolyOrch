[package]
name = "greet-cli"
version = "0.1.0"
edition = "2021"

[lib]
name = "greet"
path = "src/lib.rs"

[[bin]]
name = "greet-cli"
path = "src/main.rs"

[dependencies]

# Keep this crate its own cargo workspace root. Without it, cargo walks up
# and finds an enclosing workspace (e.g. an outer monorepo Cargo.toml) that
# does not list this package, and refuses to build it.
[workspace]
