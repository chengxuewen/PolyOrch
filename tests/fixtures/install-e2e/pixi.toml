# Fixture pixi workspace for the install-e2e e2e case: a single rust feature and a
# `rust` environment. Static file so the fixture configures without the
# manifest-mutating pixi calls the heredoc era needed. WP2 (system-rust)
# deletes this file and the pixi boot block with it.
[workspace]
channels = ["conda-forge"]
name = "polyorch-fix-install-e2e"
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

[feature.rust.dependencies]
rust = "*"

[environments]
rust = { features = ["rust"], solve-group = "rust" }
